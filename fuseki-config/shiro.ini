[users]
# Benutzer für Fuseki SPARQL-Endpunkte
# Format: username=password
# Passwort muss mit FUSEKI_PASSWORD in .env übereinstimmen
admin=admin123

[roles]
# Rollen definiert - admin hat alle Berechtigungen
admin=*

[urls]
# Status und Ping ohne Authentifizierung (für Health Checks)
/$/status = anon
/$/ping = anon
# SPARQL-Endpunkte erfordern Basic Authentication
/**/sparql = authcBasic
/**/update = authcBasic
/**/query = authcBasic
# Alle anderen URLs erfordern Basic Authentication
/** = authcBasic
