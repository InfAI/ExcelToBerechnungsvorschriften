services:
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - middleware
    restart: unless-stopped

  middleware:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - FUSEKI_URL=http://fuseki:3030
      - FUSEKI_DATASET=berechnungsvorschriften
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RDF_NAMESPACE=${RDF_NAMESPACE}
      - FUSEKI_USER=${FUSEKI_USER}
      - FUSEKI_PASSWORD=${FUSEKI_PASSWORD}
    volumes:
      - ./backend:/app
      # Excel-Dateien für Import-Script (z.B. excel_import.py --excel /app/excel_data/BERECHNUNGEN_Soziales_V3_2025_09_30.xlsx)
      - /home/kurtjunghanns/Documents/2023 - RegioNachhaltigkeit/Daten_Massnahmenkatalog:/app/excel_data:ro
    depends_on:
      - fuseki
    restart: unless-stopped

  fuseki:
    image: stain/jena-fuseki:latest
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki-data:/fuseki/databases
      - ./fuseki-config/shiro.ini:/fuseki/shiro.ini.template:ro
    environment:
      - FUSEKI_DATASET_1=berechnungsvorschriften
      - ADMIN_PASSWORD=${FUSEKI_PASSWORD}
    restart: unless-stopped
