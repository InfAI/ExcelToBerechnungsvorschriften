# Beispiel-Konfiguration für den halb-automatisierten Excel-Import
# Anpassen: excel_datei, Tabellenidentifikatoren, Tabellenblätter und Tabellen an Ihre Excel-Datei.
#
# Hierarchie: Tabellenidentifikator -> Tabellenblatt -> Tabellen
#
# formel_ersetzung (optional): Formeln in Beschreibungen durch Texte ersetzen

excel_datei: "/home/kurtjunghanns/Documents/2023 - RegioNachhaltigkeit/Daten_Massnahmenkatalog/BERECHNUNGEN_Soziales_V3_2025_09_30.xlsx"

formel_ersetzung:
  "='INTERN BEZÜGE'!$D$3": "Vollzeit festangestellt"

# Hierarchie: Tabellenidentifikator (Name) -> Tabellenblatt -> Tabellen (mit bereich, beschreibung_quelle, …)
tabellenidentifikatoren:
  - id: "Soziales"
    tabellenblaetter:
      - name: "2. Arbeitszeit AW"
        tabellen:
          - bereich: "A5:H8"
            beschreibung_quelle: "zellen"
            beschreibung_aus_zellen:
              erste_spalte_gleiche_zeile: true
              gleiche_spalte_erste_n_zeilen: 2
              trennzeichen: " – "
          - bereich: "A21:G22"
            formel_spalten: ["G"]
            wichtige_zellen: ["G21", "G22"]
            beschreibung_quelle: "zellen"
            beschreibung_aus_zellen:
              erste_spalte_gleiche_zeile: true
              trennzeichen: " – "
